<body>
    <div class="container">
        <h1>🔐 密码哈希生成器</h1>
        <p class="subtitle">为你的文章生成安全的 SHA-256 哈希值</p>

        <div class="input-group">
            <label for="password">输入密码</label>
            <input type="password" id="password" placeholder="请输入你要设置的密码">
            <div class="toggle-password">
                <input type="checkbox" id="showPassword">
                <label for="showPassword">显示密码</label>
            </div>
        </div>

        <button id="generateBtn">生成哈希值</button>

        <div class="result" id="result">
            <h3>生成的 SHA-256 哈希值：</h3>
            <div class="hash-output">
                <span id="hashOutput"></span>
                <button class="copy-btn" id="copyBtn">复制</button>
            </div>
        </div>

        <div class="info">
            <strong>使用说明：</strong>
            1. 在上方输入你想要设置的密码<br>
            2. 点击"生成哈希值"按钮<br>
            3. 复制生成的哈希值<br>
            4. 在文章的 front matter 中使用：<code>password: "你的哈希值"</code>
        </div>
    </div>

    <script>
        // 显示/隐藏密码
        document.getElementById('showPassword').addEventListener('change', function(e) {
            const passwordInput = document.getElementById('password');
            passwordInput.type = e.target.checked ? 'text' : 'password';
        });

        // 生成哈希值
        document.getElementById('generateBtn').addEventListener('click', async function() {
            const password = document.getElementById('password').value;

            if (!password) {
                alert('请输入密码！');
                return;
            }

            try {
                const hash = await sha256(password);
                document.getElementById('hashOutput').textContent = hash;
                document.getElementById('result').classList.add('show');
            } catch (error) {
                alert('生成哈希值失败：' + error.message);
            }
        });

        // 复制哈希值
        document.getElementById('copyBtn').addEventListener('click', async function() {
            const hash = document.getElementById('hashOutput').textContent;
            try {
                await navigator.clipboard.writeText(hash);
                this.textContent = '已复制！';
                this.classList.add('copied');
                setTimeout(() => {
                    this.textContent = '复制';
                    this.classList.remove('copied');
                }, 2000);
            } catch (error) {
                // 降级方案
                const textarea = document.createElement('textarea');
                textarea.value = hash;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                this.textContent = '已复制！';
                this.classList.add('copied');
                setTimeout(() => {
                    this.textContent = '复制';
                    this.classList.remove('copied');
                }, 2000);
            }
        });

        // SHA-256 哈希函数
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        // 回车键生成
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('generateBtn').click();
            }
        });
    </script>
